services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatapp_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - chatapp_net

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PRODUCTION_DB_PATH=mongodb://mongodb:27017/chatApp
      - REDIS_URL=redis://redis:6379
      - PRODUCTION_CLIENT_URL=http://localhost:3000
      # Add other required environment variables from .env here
      # - JWT_SECRET=your_jwt_secret
      # - CLOUDINARY_CLOUD_NAME=your_cloud_name
      # - CLOUDINARY_API_KEY=your_api_key
      # - CLOUDINARY_API_SECRET=your_api_secret
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    networks:
      - chatapp_net

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - chatapp_net

volumes:
  mongodb_data:

networks:
  chatapp_net:
    driver: bridge
